<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
<!-- m4_composicion_matriz (guion M4, seccion 4.1). Capas: fraccion_mineral, colageno_i, proteinas_no_colagenas, agua. Proporciones esquematicas: el segmento de proteinas no colagenas se exagera para poder tocarlo. -->
<title>Composición de la matriz ósea madura</title>
<desc>Barra apilada con cuatro segmentos: fase mineral de hidroxiapatita (el mayor, con placas de cristal), colágeno tipo I (fibras con bandas), proteínas no colágenas (puntos violeta) y agua (gotas). Colágeno y proteínas no colágenas forman la matriz orgánica. Proporciones esquemáticas.</desc>
