<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
<!-- m4_osteoide_normal_vs_osteomalacia (guion M4, seccion 4.8). Dos grupos de panel (panel_hueso_normal, panel_osteomalacia) que contienen sus capas: costura_osteoide_normal, hueso_mineralizado_normal, marcas_tetraciclina_normales, costura_osteoide_ensanchada, hueso_mineralizado_reducido, marcas_tetraciclina_difusas. Figura de apoyo sin actividad: lleva rotulos. -->
<title>Hueso normal y osteomalacia con marcaje de tetraciclina</title>
<desc>Dos paneles apilados de una superficie ósea con marcaje doble de tetraciclina. Arriba, hueso normal: una costura de osteoide delgada, de unas 10 micras, sobre el hueso mineralizado, con dos líneas amarillas nítidas y paralelas. Abajo, osteomalacia: la costura de osteoide es varias veces más ancha, el hueso mineralizado está reducido y las marcas de tetraciclina son borrosas o faltan.</desc>
