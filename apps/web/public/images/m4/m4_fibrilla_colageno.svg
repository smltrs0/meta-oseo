<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
<!-- m4_fibrilla_colageno (guion M4, seccion 4.2). Capas: molecula_tropocolageno, zona_hueco, zona_solapamiento, periodo_d, entrecruzamientos. periodo_d es una regla aparte encima de la fibrilla; su zona tactil no toca las de hueco ni solapamiento. Sin nombres de estructuras en el dibujo porque la actividad es de modo identificar. -->
<title>Fibrilla de colágeno tipo I en corte longitudinal</title>
<desc>Cinco moléculas de tropocolágeno en filas escalonadas, cada una desplazada un periodo D de la anterior. Las moléculas vecinas más pálidas completan la fila y dejan zonas de hueco entre ellas; en cada periodo hay una banda de solapamiento donde se superponen las cinco filas. Sobre la fibrilla, una regla marca los periodos D; bajo ella, el patrón de bandas oscuras y claras. Esquema no a escala.</desc>
