<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<!-- m6_escena_estrogeno_rankl. Fondo de la actividad de arrastre molecular (se muestra como imagen: lámina propia y tinta fija). Conceptual y sin escala. Los receptores coinciden con las posiciones de la actividad: ERα (16.7 %, 25 %), RANKL (50 %, 25 %), RANK (83.3 %, 25 %), c-Fms (25 %, 75 %) y TNFR1 (75 %, 75 %). Se dibujan tres precursores del mismo tipo para mostrar el grupo de precursores. Las capas de efecto, el osteoclasto, la laguna y la OPG empiezan ocultas. -->
<title>Control hormonal de la formación de osteoclastos</title>
<desc>Escena conceptual sin escala. Arriba a la izquierda, una célula osteoblástica o estromal con el receptor de estrógeno ERα dentro y moléculas de RANKL ancladas en su membrana. Arriba, un linfocito T inactivo. A la derecha y abajo, tres precursores de osteoclasto con los receptores RANK, c-Fms y TNFR1 en su superficie, sobre la superficie del hueso. Ocultos al inicio están la OPG, un osteoclasto multinucleado con su laguna de reabsorción y las flechas de cada efecto.</desc>
