<rect x="422" y="314" width="358" height="272" rx="12" fill="#fbfaff" stroke="#2b2350" stroke-width="2.5"/>
<text x="223" y="42" font-size="30" text-anchor="middle" font-weight="600" fill="#2b2350" stroke="none">Normal</text>
<text x="601" y="42" font-size="30" text-anchor="middle" font-weight="600" fill="#2b2350" stroke="none">Osteoporótico</text>
<text x="30" y="180" font-size="30" text-anchor="middle" font-weight="600" transform="rotate(-90 30 180)" fill="#2b2350" stroke="none">Vértebra</text>
<text x="30" y="450" font-size="30" text-anchor="middle" font-weight="600" transform="rotate(-90 30 450)" fill="#2b2350" stroke="none">Cortical</text>
</g>
