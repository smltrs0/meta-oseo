<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<!-- m6_hueso_normal_osteoporotico. Multicapa (explorar). Dos paneles a la misma escala: arriba, cuerpo vertebral en corte sagital (anterior a la izquierda); abajo, cortical en corte transversal. Izquierda normal, derecha osteoporótico. Esquema sin cifras. -->
<title>Hueso normal y hueso osteoporótico</title>
<desc>Dos paneles a la misma escala. Arriba, un cuerpo vertebral en corte sagital: a la izquierda, normal, con trabéculas verticales y horizontales conectadas; a la derecha, osteoporótico, con trabéculas más finas, sin las horizontales, con dos trabéculas verticales interrumpidas y con aplastamiento en cuña. Abajo, una cortical en corte transversal: a la izquierda, gruesa y con pocos poros; a la derecha, más delgada, con poros grandes, con la cavidad medular más ancha y con el contorno externo algo mayor.</desc>
<g id="fondo_lamina">
<rect x="4" y="4" width="792" height="592" rx="14" fill="#f1edfa" stroke="#2b2350" stroke-width="4"/>
<rect x="44" y="58" width="358" height="242" rx="12" fill="#fbfaff" stroke="#2b2350" stroke-width="2.5"/>
<rect x="422" y="58" width="358" height="242" rx="12" fill="#fbfaff" stroke="#2b2350" stroke-width="2.5"/>
