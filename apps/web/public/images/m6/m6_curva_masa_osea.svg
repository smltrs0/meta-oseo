<text x="405" y="346" font-size="30" text-anchor="end" font-weight="600" fill="#2b2350" stroke="none">fragilidad</text>
<text x="405" y="380" font-size="30" text-anchor="end" fill="#2b2350" stroke="none">(esquemático)</text>
</g>
