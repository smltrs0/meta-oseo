<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<!-- m6_curva_masa_osea. Animación por pasos: cada grupo es hijo directo de la raíz. Modelo esquemático sin cifras. La lámina de fondo va dentro de eje_edad_masa, que está visible en todos los pasos. -->
<title>Masa ósea a lo largo de la vida</title>
<desc>Gráfico esquemático de la masa ósea frente a la edad, de 0 a 90 años. La curva de mujeres y la de hombres suben hasta un pico entre los 20 y los 30 años, siguen en meseta y bajan; en las mujeres hay una pérdida acelerada alrededor de la menopausia. Una línea punteada marca el umbral de fragilidad y una curva con pico mayor lo cruza más tarde.</desc>
<g id="eje_edad_masa">
<rect x="4" y="4" width="792" height="592" rx="14" fill="#f1edfa" stroke="#2b2350" stroke-width="4"/>
<path d="M96 470H686M96 470V118" stroke="#2b2350" stroke-width="4"/>
<path d="M700 470L676 480L676 460Z" fill="#2b2350" stroke="none"/>
<path d="M96 104L106 128L86 128Z" fill="#2b2350" stroke="none"/>
<path d="M96 470v10" stroke="#2b2350" stroke-width="3"/><text x="96" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">0</text>
<path d="M158.7 470v10" stroke="#2b2350" stroke-width="3"/><text x="158.7" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">10</text>
<path d="M221.3 470v10" stroke="#2b2350" stroke-width="3"/><text x="221.3" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">20</text>
<path d="M284 470v10" stroke="#2b2350" stroke-width="3"/><text x="284" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">30</text>
<path d="M346.7 470v10" stroke="#2b2350" stroke-width="3"/><text x="346.7" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">40</text>
<path d="M409.3 470v10" stroke="#2b2350" stroke-width="3"/><text x="409.3" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">50</text>
<path d="M472 470v10" stroke="#2b2350" stroke-width="3"/><text x="472" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">60</text>
<path d="M534.7 470v10" stroke="#2b2350" stroke-width="3"/><text x="534.7" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">70</text>
<path d="M597.3 470v10" stroke="#2b2350" stroke-width="3"/><text x="597.3" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">80</text>
<path d="M660 470v10" stroke="#2b2350" stroke-width="3"/><text x="660" y="512" font-size="30" text-anchor="middle" fill="#2b2350" stroke="none">90</text>
<text x="378" y="568" font-size="30" text-anchor="middle" font-weight="600" fill="#2b2350" stroke="none">Edad (años)</text>
<text x="40" y="296" font-size="30" text-anchor="middle" font-weight="600" transform="rotate(-90 40 296)" fill="#2b2350" stroke="none">Masa ósea</text>
</g>
<g id="fase_crecimiento">
<rect x="96" y="122" width="125.3" height="348" fill="#6f93e2" fill-opacity="0.3" stroke="#2b2350" stroke-opacity=".6" stroke-width="2" stroke-dasharray="8 8"/>
<text x="128" y="330" font-size="30" font-weight="600" transform="rotate(-90 128 330)" fill="#2b2350" stroke="none">Construcción</text>
</g>
