<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linejoin="round" stroke-linecap="round" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<!-- m6_reborde_alveolar_cascada. Figura (se muestra como imagen) con seis cortes vestibulolinguales (vestibular a la izquierda, lingual a la derecha) de la región posterior del cuerpo mandibular, a la misma escala. Etapas 1 a 6 = clases I a VI de Cawood y Howell. El borde inferior y el conducto mandibular no cambian de posición; la línea discontinua marca la altura de la cresta en la etapa 1. Cada panel usa las mismas coordenadas locales (0 a 252 por 0 a 282) desplazadas con translate. -->
<title>Cascada de reabsorción del reborde alveolar</title>
<desc>Seis cortes transversales de la región posterior de la mandíbula, a la misma escala. Etapa 1: molar en su alvéolo, con ligamento periodontal, hueso alveolar propio, tablas corticales, flechas de carga y conducto mandibular bajo la raíz. Etapa 2: alvéolo vacío tras la extracción, con el hueso alveolar propio todavía visible y sin flechas de carga. Etapa 3: alvéolo relleno de hueso y reborde redondeado. Etapa 4: reborde en filo de cuchillo. Etapa 5: reborde plano. Etapa 6: solo hueso basal delgado, con el conducto casi en la superficie. El borde inferior y el conducto no cambian de sitio: lo que baja es la cresta.</desc>
