# nginx de la SPA del OVA (Metabolismo óseo).
#
# Se copia a /etc/nginx/conf.d/default.conf de la imagen nginxinc/nginx-unprivileged, que lo
# incluye DENTRO de `http {}`: por eso puede llevar `map` arriba y un `server` abajo.
# Hace cuatro cosas:
#   1. Sirve dist/ con fallback de SPA (cualquier ruta del router cae en index.html).
#   2. Caché: larga e inmutable solo para /assets (nombres con hash), nula para index.html.
#   3. Cabeceras de seguridad, incluida una CSP a medida (ver más abajo).
#   4. Proxifica /api hacia el servicio `api` de docker-compose (mismo origen para el navegador),
#      con el chat SSE (/api/chat) sin buffer.

# ---- Caché por URL ---------------------------------------------------------------------------
# Un `add_header` dentro de un `location` anula TODOS los `add_header` del `server`. Para no
# repetir las cabeceras de seguridad en cada bloque, la caché se decide aquí con un `map` y se
# emite con un único `add_header` en el `server`. Una cadena vacía significa "no añadir
# cabecera", así que /api/ conserva la que ponga el backend. `$uri` ya es /index.html tras el
# fallback de la SPA (redirección interna de try_files).
map $uri $ova_cache_control {
    default        "";
    /index.html    "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
    ~^/models/     "public, max-age=86400";
    /favicon.svg   "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cuerpo máximo de las peticiones. El chat admite hasta 40 mensajes de 8000 caracteres
    # (docs/api-contract.md): unos 1,3 MB en el peor caso de UTF-8, más el contexto.
    client_max_body_size 2m;

    # ---- Compresión (solo estáticos; /api/ la desactiva abajo) ----------------------------------
    # application/octet-stream cubre el modelo 3D (STL/GLB), que nginx no tipa por extensión.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        application/octet-stream;

    # ---- Cabeceras de seguridad ----------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Solo el propio sitio puede enmarcarlo. Si un LMS (Moodle, etc.) debe incrustar el OVA en un
    # iframe, agregar su origen a frame-ancestors y quitar X-Frame-Options.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $ova_cache_control;
    # HSTS no va aquí: este nginx habla HTTP y el TLS lo termina el proxy de delante (F6-06).

    # Content-Security-Policy, armada por partes para que sea legible.
    #   script-src  'self' + el hash del ÚNICO script en línea (el del tema oscuro de index.html,
    #               que evita el destello claro). Es un hash y no 'unsafe-inline' para que un XSS
    #               no pueda ejecutar scripts propios. Si cambia ese <script>, el hash cambia: el
    #               trabajo `web` de CI (.github/workflows/ci.yml) falla e imprime el valor nuevo.
    #               'wasm-unsafe-eval' solo permite compilar WebAssembly (decodificadores Draco o
    #               meshopt de un GLB); no habilita eval() de JavaScript. OJO: esos decodificadores
    #               deben servirse desde el propio sitio (p. ej. public/draco/): el valor por
    #               defecto de useGLTF/DRACOLoader es descargarlos de www.gstatic.com, que esta
    #               CSP bloquea a propósito (además de enviar la IP del estudiante a un tercero).
    #   style-src   'unsafe-inline' porque Vue, GSAP y Reka UI escriben atributos style; el riesgo
    #               de inyectar estilos es mucho menor que el de scripts.
    #   img-src     data: (SVG en línea) y blob: (texturas que three.js decodifica).
    #   connect-src /api y los modelos son del mismo origen; blob: y data: para los cargadores de
    #               three.js (ImageBitmapLoader hace fetch de blob: y de data:).
    #   worker-src  blob: para los workers que three.js/Draco crean en línea.
    #   media-src   <video> propio; blob: por si se usa HLS (MSE).
    # Cuando un módulo necesite un origen externo (p. ej. un video incrustado) hay que sumarlo aquí
    # a propósito: media-src / frame-src / img-src. Con default-src 'self' todo lo demás se bloquea.
    set $csp "default-src 'self'";
    set $csp "${csp}; script-src 'self' 'sha256-AHMKCcsPUffYHlGMwDyoXugIMwstlANFFbhN+C9vrJQ=' 'wasm-unsafe-eval'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; img-src 'self' data: blob:";
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; media-src 'self' blob:";
    set $csp "${csp}; connect-src 'self' blob: data:";
    set $csp "${csp}; worker-src 'self' blob:";
    set $csp "${csp}; manifest-src 'self'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;

    # ---- Proxy hacia la API --------------------------------------------------------------------
    # El DNS interno de Docker (127.0.0.11) y una variable en proxy_pass hacen que `api` se
    # resuelva en cada petición: nginx arranca aunque la API aún no exista y sigue funcionando
    # si el contenedor de la API se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Estos proxy_* los heredan los dos `location` de /api (ninguno define proxy_set_header propio).
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    # SOBRESCRIBEN (no añaden) X-Forwarded-For: la API con TRUST_PROXY=true toma el primer valor
    # de esa cabecera para su límite de intentos por IP. Con $proxy_add_x_forwarded_for un cliente
    # podría anteponer IPs falsas y esquivar el límite (ver services/api/app/core/rate_limit.py).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Si delante de este nginx hay OTRO proxy (el que termina TLS en el VPS, F6-06), todas las
    # peticiones llegarían con la IP de ese proxy y el límite por IP contaría a todos los
    # estudiantes como uno solo. En ese caso, arriba de `server`/aquí, con la red del proxy:
    #   set_real_ip_from <red del proxy>;
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;
    # y $remote_addr (usado arriba) pasa a ser la IP real del estudiante.

    # Chat del mentor: Server-Sent Events (POST /api/chat). Sin buffer en ninguno de los dos
    # sentidos para que cada evento llegue al navegador al instante. La API emite un `: ping`
    # cada 15 s; cada lectura reinicia proxy_read_timeout, así que 600 s es holgado incluso con
    # pensamiento largo. La cabecera X-Accel-Buffering: no de la API también se respeta (no se
    # ignora con proxy_ignore_headers). El bloque regex gana al prefijo /api/ de abajo.
    location ~ ^/api/chat(/|$) {
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Resto de la API: JSON corto. Sin gzip (los JSON llevan tokens: evita ataques tipo BREACH y
    # ahorra poco). El buffer queda activo, pero una respuesta con X-Accel-Buffering: no lo apaga.
    location /api/ {
        proxy_pass $api_upstream;
        gzip off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Estáticos y SPA ---------------------------------------------------------------------------
    # Un archivo que falta en /assets o /models debe ser 404, no el index.html del fallback: el
    # navegador o el cargador 3D recibirían HTML donde esperan JS o una malla y el error sería
    # incomprensible (típico justo después de un despliegue, con el hash del build anterior).
    location /assets/ {
        try_files $uri =404;
    }

    location /models/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
