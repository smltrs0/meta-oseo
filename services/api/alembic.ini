# Configuración de Alembic para services/api.
# La URL de la base de datos NO se define aquí: alembic/env.py la toma de la configuración de la
# app (DATABASE_URL o el .env de la raíz), igual que la API.
#
# Uso (desde services/api):
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "descripcion"
#   uv run alembic upgrade head --sql      # solo imprime el DDL

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
